spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

jwt:
    secret: ${JWT_SECRET}
    expiration:  86400000 #24h
    refresh-expiration: 604800000 #7days
cors:
    allowed-origin:${CORS_ALLOWED_ORIGIN}